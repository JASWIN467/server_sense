version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: serversense-server
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
    env_file:
      - ./server/.env
    networks:
      - serversense-network
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: serversense-client
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - serversense-network
    restart: unless-stopped

networks:
  serversense-network:
    driver: bridge



