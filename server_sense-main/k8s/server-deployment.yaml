apiVersion: apps/v1
kind: Deployment
metadata:
  name: serversense-server
  labels:
    app: serversense-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: serversense-server
  template:
    metadata:
      labels:
        app: serversense-server
    spec:
      containers:
      - name: server
        image: serversense-server:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: serversense-secrets
              key: MONGODB_URI
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: serversense-secrets
              key: JWT_SECRET
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: serversense-secrets
              key: GEMINI_API_KEY
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /api/metrics/health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
