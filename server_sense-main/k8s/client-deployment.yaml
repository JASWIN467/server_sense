apiVersion: apps/v1
kind: Deployment
metadata:
  name: serversense-client
  labels:
    app: serversense-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: serversense-client
  template:
    metadata:
      labels:
        app: serversense-client
    spec:
      containers:
      - name: client
        image: serversense-client:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
